# Non-secret command-line configuration for fiducia-node. Shared authentication
# material and the insecure-development escape hatch remain environment-only.
[help]
url = "https://github.com/fiducia-cloud/fiducia-node.rs"
columns = ["options", "env", "type", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["FIDUCIA_INTERNAL_SECRET", "FIDUCIA_ALLOW_INSECURE_INTERNAL"]

[flags.port]
env = "PORT"
aliases = ["port"]
short = "p"
type = "integer"
help = "Client-facing HTTP listen port."

[flags.peer-port]
env = "FIDUCIA_PEER_PORT"
aliases = ["peer-port"]
type = "integer"
help = "Raft peer-plane listen port."

[flags.node-id]
env = "FIDUCIA_NODE_ID"
aliases = ["node-id"]
type = "string"
help = "Stable Raft node identifier."

[flags.peers]
env = "FIDUCIA_PEERS"
aliases = ["peers"]
type = "string"
help = "Comma-separated Raft peer addresses."

[flags.shard-count]
env = "FIDUCIA_SHARD_COUNT"
aliases = ["shard-count"]
type = "integer"
help = "Number of logical shards."

[flags.data-dir]
env = "FIDUCIA_DATA_DIR"
aliases = ["data-dir"]
type = "string"
help = "Durable Raft data directory."

[flags.raft-tick-ms]
env = "FIDUCIA_RAFT_TICK_MS"
aliases = ["raft-tick-ms"]
type = "integer"
help = "Raft driver tick interval in milliseconds."

[flags.raft-heartbeat-ms]
env = "FIDUCIA_RAFT_HEARTBEAT_MS"
aliases = ["raft-heartbeat-ms"]
type = "integer"
help = "Raft heartbeat interval in milliseconds."

[flags.raft-election-min-ms]
env = "FIDUCIA_RAFT_ELECTION_MIN_MS"
aliases = ["raft-election-min-ms"]
type = "integer"
help = "Minimum Raft election timeout in milliseconds."

[flags.raft-election-jitter-ms]
env = "FIDUCIA_RAFT_ELECTION_JITTER_MS"
aliases = ["raft-election-jitter-ms"]
type = "integer"
help = "Additional randomized election timeout in milliseconds."

[flags.raft-prevote]
env = "FIDUCIA_RAFT_PREVOTE"
aliases = ["raft-prevote"]
type = "bool"
help = "Enable Raft pre-vote."

[flags.raft-check-quorum]
env = "FIDUCIA_RAFT_CHECK_QUORUM"
aliases = ["raft-check-quorum"]
type = "bool"
help = "Enable leader quorum checks."

[flags.raft-snapshot-threshold]
env = "FIDUCIA_RAFT_SNAPSHOT_THRESHOLD"
aliases = ["raft-snapshot-threshold"]
type = "integer"
help = "Committed entries between snapshots; zero disables snapshots."

[flags.raft-peer-max-body-bytes]
env = "FIDUCIA_RAFT_PEER_MAX_BODY_BYTES"
aliases = ["raft-peer-max-body-bytes"]
type = "integer"
help = "Maximum serialized request body accepted and emitted on the Raft peer plane."

[flags.raft-append-max-bytes]
env = "FIDUCIA_RAFT_APPEND_MAX_BYTES"
aliases = ["raft-append-max-bytes"]
type = "integer"
help = "Target maximum serialized bytes in one AppendEntries batch."

[flags.raft-append-max-entries]
env = "FIDUCIA_RAFT_APPEND_MAX_ENTRIES"
aliases = ["raft-append-max-entries"]
type = "integer"
help = "Maximum log entries in one AppendEntries batch."

[flags.raft-rpc-timeout-ms]
env = "FIDUCIA_RAFT_RPC_TIMEOUT_MS"
aliases = ["raft-rpc-timeout-ms"]
type = "integer"
help = "Timeout for vote and bounded AppendEntries peer requests."

[flags.raft-snapshot-timeout-ms]
env = "FIDUCIA_RAFT_SNAPSHOT_TIMEOUT_MS"
aliases = ["raft-snapshot-timeout-ms"]
type = "integer"
help = "Longer timeout for bounded InstallSnapshot peer requests."

[flags.log]
env = "RUST_LOG"
aliases = ["log"]
type = "string"
help = "Rust tracing filter."
