# Schema-v1 manifest consumed by the incubating fmctl runner.
schema_version = 1
project = "fiducia-node"
model = "union-lock-v2"
language = "quint"
spec = "formal/union_lock.qnt"
main = "union_lock"
init = "init"
step = "step"
invariants = ["union_lock_safety"]
witnesses = [
  "queued_work_reached",
  "concurrent_disjoint_grants_reached",
  "cancellation_tombstone_reached",
  "token_exhaustion_reached",
]

[toolchain]
quint = "0.32.0"
node = "22"
java = "21"
rust = "1.95.0"
npx = "npx"

[execution]
timeout_seconds = 1200
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 35

[verification]
backend = "apalache"
max_steps = 5

[traces]
format = "itf"
model_based_testing_metadata = true
backend = "typescript"
count = 8
max_steps = 25
max_samples = 10000
seed = "56620260729"

[adapters.rust]
strategy = "bounded-independent-reference-and-itf-replay"
target = "tests/formal_union_lock_refinement.rs"
status = "active"
issue = "DEN-566"

[adapters.typescript]
strategy = "itf-json-driver"
status = "planned"

[adapters.dart]
strategy = "itf-json-driver"
status = "planned"

[adapters.go]
strategy = "itf-json-driver"
status = "planned"

[adapters.gleam]
strategy = "itf-json-driver"
status = "planned"
