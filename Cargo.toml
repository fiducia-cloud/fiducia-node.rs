# Crate manifest for fiducia-node: dependencies, build config, and binary metadata.
[package]
name = "fiducia-node"
version = "0.1.0"
edition = "2021"
description = "Raft-replicated coordination engine for fiducia.cloud — config KV with watches, leader election, and service discovery."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
tower-http = { version = "0.5", features = ["trace", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.2.1" }
fiducia-routing = { path = "../fiducia-routing.rs" }
fiducia-interfaces = { path = "../fiducia-interfaces/generated/rust" }

# Shared external-orchestration lock identities. This facade deliberately uses
# ores-locks-and-leases with its Fiducia feature disabled, so a Fiducia node can
# coordinate bootstrap/migration/maintenance via Cloudflare DO or another
# authority without recursively requiring the Fiducia service it is starting.
fiducia-lib-core = { git = "https://github.com/fiducia-cloud/fiducia-lib-core.git", rev = "47d637ba92db3fc35b04bafe9bf66ff5b0223216", default-features = false }
