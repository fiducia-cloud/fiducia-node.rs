name: apply cron hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cron-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out node branch
        uses: actions/checkout@v4
        with:
          ref: agent/cron-service-hardening
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Detect staged patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'repo/.github/cron-bundle/part*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Cron hardening patch already applied; nothing to do.'
          fi

      - name: Check out pinned interfaces dependency
        if: steps.patch.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
          persist-credentials: false

      - name: Check out pinned routing dependency
        if: steps.patch.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: steps.patch.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply checksumed source patch
        if: steps.patch.outputs.present == 'true'
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cron-bundle/part* > /tmp/cron-hardening.patch.gz.b64
          printf '%s  %s\n' \
            'a1d10dc59437c5d0fc5f808ab702fa67680e90232a417cae3d7a554be81c7213' \
            '/tmp/cron-hardening.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/cron-hardening.patch.gz.b64 | gzip --decompress > /tmp/cron-hardening.patch
          printf '%s  %s\n' \
            '1169fd7deb12ce6e5889aeb9f01300047c5e204cc16187604e89af4757e3caaf' \
            '/tmp/cron-hardening.patch' | sha256sum --check --strict
          git apply --check /tmp/cron-hardening.patch
          git apply /tmp/cron-hardening.patch
          git diff --check

      - name: Format, compile, lint, and test
        if: steps.patch.outputs.present == 'true'
        working-directory: repo
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cargo fmt --all
            cargo fmt --all -- --check
            cargo check --all-targets --all-features
            cargo clippy --all-targets --all-features --locked -- -D warnings
            cargo test --all-targets --all-features --locked
            git diff --check
          } 2>&1 | tee cron-build.log

      - name: Upload build diagnostics
        if: always() && steps.patch.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cron-hardening-build-${{ github.run_id }}
          path: repo/cron-build.log
          if-no-files-found: warn

      - name: Commit validated implementation
        if: steps.patch.outputs.present == 'true'
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/cron-bundle .github/cron-patch
          rm -f cron-build.log
          git add -A
          git diff --cached --check
          git config user.name 'fiducia-cloud automation'
          git config user.email 'automation@fiducia.cloud'
          git commit -m 'harden cron service control plane and telemetry'
          git push origin HEAD:agent/cron-service-hardening
