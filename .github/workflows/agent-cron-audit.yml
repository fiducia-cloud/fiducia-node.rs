name: agent cron audit

on:
  push:
    branches:
      - agent/cron-service-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect protocol and schedule call sites
        run: |
          printf '%s\n' '=== protocol call sites ==='
          rg -n "CURRENT_COMMAND_PROTOCOL|LEGACY_COMMAND_PROTOCOL|requires_current_protocol|for_active_protocol|ActivateCommandProtocol|Schedule(Upsert|ClaimFire|RecordResult|RecordRun)" src tests || true
          printf '%s\n' '=== workflow inventory ==='
          find .github/workflows -maxdepth 1 -type f -print | sort
