name: DEN-1154 fencing ceiling resume

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/den-1154-fencing-ceiling-resume.yml'

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out fiducia-node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
          path: repo
      - name: Check out pinned fiducia-interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
      - name: Check out pinned fiducia-routing sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Reapply the previously validated source edit payload
        working-directory: repo
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/den-1154-fencing-ceiling.yml').read_text()
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/den-1154\.py", workflow)
          if not match:
              raise SystemExit('could not recover DEN-1154 patch payload from the original one-shot workflow')
          Path('/tmp/den-1154.py').write_bytes(base64.b64decode(match.group(1)))
          PY
          python3 /tmp/den-1154.py
      - name: Format and run exact fencing boundary tests on the binary harness
        working-directory: repo
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test fencing_token_bounds_match_the_public_json_safe_domain --locked
          cargo test fencing_token_minting_fails_closed_at_the_json_safe_ceiling --locked
          cargo test handoff_mint_above_fails_closed_at_the_json_safe_ceiling --locked
          cargo test restore_rejects_fencing_authority_outside_the_json_safe_domain --locked
          cargo test snapshot_restore_keeps_the_fencing_counter_ahead_of_prior_grants --locked
          cargo test restore_rejects_a_zeroed_or_missing_fencing_counter --locked
      - name: Commit the tested source and remove temporary workflows
        working-directory: repo
        run: |
          set -euo pipefail
          rm .github/workflows/den-1154-fencing-ceiling.yml
          rm .github/workflows/den-1154-fencing-ceiling-resume.yml
          git add src/state.rs src/validate.rs .github/workflows/den-1154-fencing-ceiling.yml .github/workflows/den-1154-fencing-ceiling-resume.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'DEN-1154 cap Fiducia fencing authority at JSON-safe ceiling'
          git push origin HEAD:main
