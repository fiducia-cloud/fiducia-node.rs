# Temporary trusted-branch promotion lane; remove after Cargo.lock is committed.
name: tmp-den566-lock-promote
on:
  push:
    branches: [den-566-external-locks-adoption]
    paths:
      - '.github/workflows/tmp-den566-lock-refresh.yml'
      - 'Cargo.toml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-566-external-locks-adoption
          path: repo
          submodules: recursive
          persist-credentials: true
      - name: Assert trusted branch
        run: test "$(git -C repo branch --show-current)" = "den-566-external-locks-adoption"
      - name: Check out immutable fiducia interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
          persist-credentials: false
      - name: Check out immutable fiducia routing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
          persist-credentials: false
      - name: Generate and validate exact lock graph
        working-directory: repo
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps >/dev/null
          test -z "$(git diff --name-only -- . ':!Cargo.lock')"
      - name: Commit only Cargo.lock
        working-directory: repo
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DEN-566 refresh Cargo.lock for external locks'
          git push origin HEAD:den-566-external-locks-adoption
