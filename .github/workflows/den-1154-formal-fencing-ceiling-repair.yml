name: DEN-1154 formal fencing ceiling repair

on:
  push:
    branches:
      - DEN-1154-formal-fencing-ceiling
    paths:
      - '.github/workflows/den-1154-formal-fencing-ceiling-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out fiducia-node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          path: repo
      - name: Check out pinned fiducia-interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
      - name: Check out pinned fiducia-routing sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Repair stale formal exhaustion fixtures
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/formal_union_lock_refinement.rs')
          text = p.read_text()
          count = text.count('u64::MAX')
          if count != 5:
              raise SystemExit(f'expected exactly 5 stale u64::MAX fencing references, found {count}')
          text = text.replace('u64::MAX', 'validate::MAX_FENCING_TOKEN')
          p.write_text(text)
          PY
          rustfmt --edition 2021 tests/formal_union_lock_refinement.rs
      - name: Run exact fencing refinement checks
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 formal/check_lease_fencing_sentinel.py
          cargo test --locked --test formal_union_lock_refinement -- --nocapture
          cargo test --locked fencing_token -- --nocapture
      - name: Commit tested repair and remove helper
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1154-formal-fencing-ceiling-repair.yml
          git add tests/formal_union_lock_refinement.rs formal/check_lease_fencing_sentinel.py formal/RUST_REFINEMENT.md .github/workflows/den-1154-formal-fencing-ceiling-repair.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'DEN-1154 bind formal fencing exhaustion to public ceiling'
          git push origin HEAD:DEN-1154-formal-fencing-ceiling
