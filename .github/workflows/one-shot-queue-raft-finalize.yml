name: one-shot queue and Raft hardening finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: queue-raft-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/queue-raft-recovery-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          path: fiducia-node.rs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply queue and recovery hardening
        working-directory: fiducia-node.rs
        run: python3 .github/scripts/apply_queue_raft_hardening.py
      - name: Preserve request-scoped recovery semantics
        working-directory: fiducia-node.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/state.rs")
          text = path.read_text()
          old = '''            if self.locks.grants.values().any(|grant| {
              grant.holder == queued.holder && grant.keys == queued.keys
            }) {
              return Err("the same union-lock identity is both granted and queued".to_string());
            }
          '''
          new = '''            if self.locks.grants.values().any(|grant| {
              grant.holder == queued.holder
                && grant.keys == queued.keys
                && grant.request_id == queued.request_id
            }) {
              return Err(
                "the same lock acquisition attempt is both granted and queued".to_string(),
              );
            }
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  "expected exactly one over-broad granted/queued lock invariant"
              )
          text = text.replace(old, new, 1)

          marker = "    // Proves whether a lost-response RETRY of an acquire is safe server-side —\n"
          tests = '''    #[test]
              fn restore_allows_same_union_identity_with_distinct_attempt_ids() {
                let mut store = Store::default();
                store.next_fencing_token = 1;
                store.locks.grants.insert(
                  1,
                  LockGrant {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    fencing_token: 1,
                    lease_expires_ms: 10_000,
                    request_id: Some("attempt-1".to_string()),
                  },
                );
                store.locks.held.insert("a".to_string(), 1);
                assert!(store.locks.queue.push_back(
                  ("owner".to_string(), vec!["a".to_string()]),
                  QueuedLock {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    ttl_ms: 1_000,
                    requested_ms: 1,
                    wait_expires_ms: Some(2_000),
                    request_id: Some("attempt-2".to_string()),
                  },
                ));

                StateMachine::new()
                  .restore(&serde_json::to_vec(&store).unwrap())
                  .expect("distinct attempts may share a union identity across grant and queue");
              }

              #[test]
              fn restore_rejects_exact_lock_attempt_both_granted_and_queued() {
                let mut store = Store::default();
                store.next_fencing_token = 1;
                store.locks.grants.insert(
                  1,
                  LockGrant {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    fencing_token: 1,
                    lease_expires_ms: 10_000,
                    request_id: Some("attempt-1".to_string()),
                  },
                );
                store.locks.held.insert("a".to_string(), 1);
                assert!(store.locks.queue.push_back(
                  ("owner".to_string(), vec!["a".to_string()]),
                  QueuedLock {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    ttl_ms: 1_000,
                    requested_ms: 1,
                    wait_expires_ms: Some(2_000),
                    request_id: Some("attempt-1".to_string()),
                  },
                ));

                let error = StateMachine::new()
                  .restore(&serde_json::to_vec(&store).unwrap())
                  .expect_err("one exact attempt cannot hold authority and remain queued");
                assert!(error.to_string().contains("acquisition attempt"));
              }

          '''
          if text.count(marker) != 1:
              raise SystemExit("expected one state-test insertion marker")
          path.write_text(text.replace(marker, tests + marker, 1))
          PY
      - name: Format
        working-directory: fiducia-node.rs
        run: cargo fmt --all
      - name: Test all targets and features
        working-directory: fiducia-node.rs
        run: cargo test --locked --all-targets --all-features
      - name: Clippy
        working-directory: fiducia-node.rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Commit verified product source and remove one-shot machinery
        working-directory: fiducia-node.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/apply_queue_raft_hardening.py \
            .github/workflows/one-shot-queue-raft-audit.yml \
            .github/workflows/one-shot-queue-raft-pr.yml \
            .github/workflows/one-shot-queue-raft-diagnose.yml \
            .github/workflows/one-shot-queue-raft-v2.yml \
            .github/workflows/one-shot-queue-raft-finalize.yml \
            .github/one-shot-queue-raft-trigger
          git add src/indexed_queue.rs src/state.rs src/persist.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: harden lock queues and Raft recovery invariants'
          git push origin HEAD:audit/queue-raft-recovery-hardening
