name: one-shot queue and Raft hardening finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: queue-raft-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/queue-raft-recovery-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          path: fiducia-node.rs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Apply queue and recovery hardening
        working-directory: fiducia-node.rs
        run: python3 .github/scripts/apply_queue_raft_hardening.py
      - name: Preserve request-scoped recovery semantics
        working-directory: fiducia-node.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/state.rs")
          text = path.read_text()
          old_condition = "grant.holder == queued.holder && grant.keys == queued.keys"
          new_condition = """grant.holder == queued.holder
                          && grant.keys == queued.keys
                          && grant.request_id == queued.request_id"""
          old_error = '"the same union-lock identity is both granted and queued"'
          new_error = '"the same lock acquisition attempt is both granted and queued"'
          if text.count(old_condition) != 1:
              raise SystemExit("expected exactly one over-broad lock condition")
          if text.count(old_error) != 1:
              raise SystemExit("expected exactly one over-broad lock error")
          text = text.replace(old_condition, new_condition, 1)
          text = text.replace(old_error, new_error, 1)

          marker = "    // Proves whether a lost-response RETRY of an acquire is safe server-side —\n"
          tests = '''    #[test]
              fn restore_allows_same_union_identity_with_distinct_attempt_ids() {
                let mut store = Store::default();
                store.next_fencing_token = 1;
                store.locks.grants.insert(
                  1,
                  LockGrant {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    fencing_token: 1,
                    lease_expires_ms: 10_000,
                    request_id: Some("attempt-1".to_string()),
                  },
                );
                store.locks.held.insert("a".to_string(), 1);
                assert!(store.locks.queue.push_back(
                  ("owner".to_string(), vec!["a".to_string()]),
                  QueuedLock {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    ttl_ms: 1_000,
                    requested_ms: 1,
                    wait_expires_ms: Some(2_000),
                    request_id: Some("attempt-2".to_string()),
                  },
                ));

                StateMachine::new()
                  .restore(&serde_json::to_vec(&store).unwrap())
                  .expect("distinct attempts may share a union identity across grant and queue");
              }

              #[test]
              fn restore_rejects_exact_lock_attempt_both_granted_and_queued() {
                let mut store = Store::default();
                store.next_fencing_token = 1;
                store.locks.grants.insert(
                  1,
                  LockGrant {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    fencing_token: 1,
                    lease_expires_ms: 10_000,
                    request_id: Some("attempt-1".to_string()),
                  },
                );
                store.locks.held.insert("a".to_string(), 1);
                assert!(store.locks.queue.push_back(
                  ("owner".to_string(), vec!["a".to_string()]),
                  QueuedLock {
                    holder: "owner".to_string(),
                    keys: vec!["a".to_string()],
                    ttl_ms: 1_000,
                    requested_ms: 1,
                    wait_expires_ms: Some(2_000),
                    request_id: Some("attempt-1".to_string()),
                  },
                ));

                let error = StateMachine::new()
                  .restore(&serde_json::to_vec(&store).unwrap())
                  .expect_err("one exact attempt cannot hold authority and remain queued");
                assert!(error.to_string().contains("acquisition attempt"));
              }

          '''
          if text.count(marker) != 1:
              raise SystemExit("expected one state-test insertion marker")
          path.write_text(text.replace(marker, tests + marker, 1))
          PY
      - name: Keep adversarial test construction Clippy-clean
        working-directory: fiducia-node.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          queue_path = Path("src/indexed_queue.rs")
          queue = queue_path.read_text()
          map_entry_pattern = re.compile(
              r"let expected = if values\.contains_key\(&key\) \{\s*"
              r"false\s*\} else \{\s*"
              r"order\.push_back\(key\);\s*"
              r"values\.insert\(key, step\);\s*"
              r"true\s*\};"
          )
          queue_replacement = """let expected =
                          if let std::collections::hash_map::Entry::Vacant(entry) = values.entry(key) {
                              order.push_back(key);
                              entry.insert(step);
                              true
                          } else {
                              false
                          };"""
          queue, queue_count = map_entry_pattern.subn(queue_replacement, queue)
          if queue_count != 1:
              raise SystemExit(
                  f"expected exactly one contains_key/insert test pattern, found {queue_count}"
              )
          queue_path.write_text(queue)

          state_path = Path("src/state.rs")
          state = state_path.read_text()
          token_one_pattern = re.compile(
              r"let mut store = Store::default\(\);\s*"
              r"store\.next_fencing_token = 1;"
          )
          token_one_replacement = """let mut store = Store {
                  next_fencing_token: 1,
                  ..Store::default()
              };"""
          state, token_one_count = token_one_pattern.subn(token_one_replacement, state)
          if token_one_count != 3:
              raise SystemExit(
                  f"expected three token-one Store test initializers, found {token_one_count}"
              )

          token_two_pattern = re.compile(
              r"let mut store = Store::default\(\);\s*"
              r"store\.next_fencing_token = 2;"
          )
          token_two_replacement = """let mut store = Store {
                  next_fencing_token: 2,
                  ..Store::default()
              };"""
          state, token_two_count = token_two_pattern.subn(token_two_replacement, state)
          if token_two_count != 1:
              raise SystemExit(
                  f"expected one token-two Store test initializer, found {token_two_count}"
              )
          state_path.write_text(state)
          PY
      - name: Format
        working-directory: fiducia-node.rs
        run: cargo fmt --all
      - name: Test all targets and features
        working-directory: fiducia-node.rs
        run: cargo test --locked --all-targets --all-features
      - name: Clippy
        working-directory: fiducia-node.rs
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Commit verified product source and remove one-shot machinery
        working-directory: fiducia-node.rs
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/apply_queue_raft_hardening.py \
            .github/workflows/one-shot-queue-raft-audit.yml \
            .github/workflows/one-shot-queue-raft-pr.yml \
            .github/workflows/one-shot-queue-raft-diagnose.yml \
            .github/workflows/one-shot-queue-raft-v2.yml \
            .github/workflows/one-shot-queue-raft-finalize.yml \
            .github/one-shot-queue-raft-trigger
          git add src/indexed_queue.rs src/state.rs src/persist.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: harden lock queues and Raft recovery invariants'
          git push origin HEAD:audit/queue-raft-recovery-hardening
