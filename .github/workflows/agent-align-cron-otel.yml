name: align cron telemetry dependencies

on:
  push:
    branches:
      - agent/cron-service-hardening

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-service-hardening
          fetch-depth: 0
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: 2c5c806174e067fbe83ad48b724366323ba390a2
          path: fiducia-interfaces
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Use the telemetry crate's OpenTelemetry generation
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Cargo.toml')
          source = path.read_text()
          replacements = {
              'tracing-opentelemetry = "0.33"': 'tracing-opentelemetry = "0.28"',
              'opentelemetry = "0.32"': 'opentelemetry = "0.27"',
              'opentelemetry_sdk = { version = "0.32", features = ["trace"] }': 'opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one manifest entry: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo update
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          lock = tomllib.loads(Path('Cargo.lock').read_text())
          forbidden = {
              ('opentelemetry', '0.32.0'),
              ('opentelemetry_sdk', '0.32.1'),
              ('tracing-opentelemetry', '0.33.0'),
          }
          present = {(p['name'], p['version']) for p in lock.get('package', [])}
          remaining = sorted(forbidden & present)
          if remaining:
              raise SystemExit(f'duplicate telemetry generation remains: {remaining}')
          PY
          rm .github/workflows/agent-align-cron-otel.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock .github/workflows/agent-align-cron-otel.yml
          git commit -m 'fix: align cron telemetry dependency versions'
          git push origin HEAD:agent/cron-service-hardening
