name: DEN-1154 rustls advisory repair

on:
  push:
    branches:
      - DEN-1154-formal-fencing-ceiling
    paths:
      - '.github/workflows/den-1154-rustls-advisory-repair.yml'

permissions:
  contents: write

jobs:
  refresh-lock-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out fiducia-node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          path: repo
      - name: Check out pinned fiducia-interfaces sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: ee8fe09f846f5a776d156c0b0d0d15582c8bd539
          path: fiducia-interfaces
      - name: Check out pinned fiducia-routing sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-routing.rs
          ref: c694bc5c58587bec12989a347e926c0040aacada
          path: fiducia-routing.rs
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
      - name: Refresh rustls to patched advisory floor
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Cargo.lock').read_text()
          marker = 'name = "rustls"\nversion = "0.23.45"'
          if marker not in text:
              raise SystemExit('Cargo.lock did not resolve rustls 0.23.45')
          if 'name = "rustls"\nversion = "0.23.42"' in text:
              raise SystemExit('vulnerable rustls 0.23.42 remains in Cargo.lock')
          PY
          cargo check --locked
      - name: Commit tested lock refresh and remove helper
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-1154-rustls-advisory-repair.yml
          git add Cargo.lock .github/workflows/den-1154-rustls-advisory-repair.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'build(DEN-1154): refresh rustls past RUSTSEC-2026-0285'
          git push origin HEAD:DEN-1154-formal-fencing-ceiling
