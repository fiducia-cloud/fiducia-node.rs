# Secret-gated deploy to the TEST environment.
#
# Required secrets (repo Settings -> Secrets and variables -> Actions):
#   KUBE_CONFIG_TEST  base64-encoded kubeconfig with access to the `fiducia-test`
#                     namespace. Missing or blank credentials fail the job;
#                     a successful workflow means the rollout completed.
#
# Topology: app repos deploy to the TEST environment from their own CI; the
# fiducia-monorepo is the only PROD deploy. This is the TEST half for this
# service -- it rolls the `fiducia-test` namespace deployment to the image
# tagged with this commit SHA (ghcr.io/fiducia-cloud/fiducia-node:<sha>),
# built/pushed by docker.yml.
name: deploy-test

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: deploy to test
        env:
          KUBE_CONFIG_TEST: ${{ secrets.KUBE_CONFIG_TEST }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_TEST//[[:space:]]/}" ]; then
            echo "::error::KUBE_CONFIG_TEST must be a nonblank base64-encoded kubeconfig"
            exit 1
          fi

          umask 077
          export KUBECONFIG="${RUNNER_TEMP}/fiducia-node-kubeconfig"
          printf '%s' "$KUBE_CONFIG_TEST" \
            | base64 --decode \
            | install -m 0600 /dev/stdin "$KUBECONFIG"
          unset KUBE_CONFIG_TEST

          kubectl -n fiducia-test set image deployment/fiducia-node \
            fiducia-node=ghcr.io/fiducia-cloud/fiducia-node:${{ github.sha }}
          kubectl -n fiducia-test rollout status deployment/fiducia-node \
            --timeout=5m
