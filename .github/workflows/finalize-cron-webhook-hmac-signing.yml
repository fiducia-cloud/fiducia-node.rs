name: Finalize cron webhook HMAC signing

on:
  push:
    branches:
      - agent/cron-webhook-hmac-signing
    paths:
      - scripts/apply-cron-webhook-hmac-signing.py
      - .github/workflows/finalize-cron-webhook-hmac-signing.yml

permissions:
  contents: write

concurrency:
  group: finalize-cron-webhook-hmac-signing
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/cron-webhook-hmac-signing
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply-cron-webhook-hmac-signing.py

      - name: Format Rust source
        run: |
          rustup component add rustfmt
          cargo fmt --all

      - name: Remove one-shot patch scaffolding
        run: |
          rm scripts/apply-cron-webhook-hmac-signing.py
          rm .github/workflows/finalize-cron-webhook-hmac-signing.yml

      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes produced" >&2
            exit 1
          fi
          git commit -m "feat: authenticate cron webhook deliveries"
          git push origin HEAD:agent/cron-webhook-hmac-signing
