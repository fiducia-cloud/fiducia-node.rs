name: Formal methods

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'formal/**'
      - 'docs/FORMAL_METHODS.md'
      - '.github/workflows/formal-methods.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'formal/**'
      - 'docs/FORMAL_METHODS.md'
      - '.github/workflows/formal-methods.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-coordination-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exhaust lease and fencing model
        run: python3 formal/check_model.py
