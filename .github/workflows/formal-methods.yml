name: Formal methods

on:
  pull_request:
    paths:
      - '.github/workflows/formal-methods.yml'
      - '.nix/**'
      - 'flake.lock'
      - 'flake.nix'
      - 'formal/**'
      - 'src/consensus.rs'
      - 'src/persist.rs'
      - 'src/raft_api.rs'
      - 'src/state.rs'
      - 'src/transport.rs'
      - 'src/raft_reply.rs'
      - 'src/transport_replication_tests.rs'
      - 'src/indexed_queue.rs'
      - 'src/cron.rs'
      - 'src/validate.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/FORMAL_METHODS.md'
      - 'tests/formal_*.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-methods.yml'
      - '.nix/**'
      - 'flake.lock'
      - 'flake.nix'
      - 'formal/**'
      - 'src/consensus.rs'
      - 'src/persist.rs'
      - 'src/raft_api.rs'
      - 'src/state.rs'
      - 'src/transport.rs'
      - 'src/raft_reply.rs'
      - 'src/transport_replication_tests.rs'
      - 'src/indexed_queue.rs'
      - 'src/cron.rs'
      - 'src/validate.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/FORMAL_METHODS.md'
      - 'tests/formal_*.rs'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raft-reply:
    name: Raft replication evidence model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install repository-pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Exhaustively check production reply admission and negative control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts
          git rev-parse HEAD > .formal-artifacts/raft-reply-source.txt
          rustc --version --verbose >> .formal-artifacts/raft-reply-source.txt
          sha256sum src/raft_reply.rs src/transport.rs src/transport_replication_tests.rs \
            tests/formal_raft_reply_refinement.rs formal/RAFT_REPLY_MODEL.md \
            > .formal-artifacts/raft-reply-inputs.sha256
          rustc --edition=2021 --deny warnings --test tests/formal_raft_reply_refinement.rs \
            -o "$RUNNER_TEMP/fiducia-raft-reply-model"
          "$RUNNER_TEMP/fiducia-raft-reply-model" --nocapture 2>&1 \
            | tee .formal-artifacts/raft-reply-model.log
          rustfmt --edition 2021 --check src/raft_reply.rs tests/formal_raft_reply_refinement.rs

      - name: Upload exact-head bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-raft-reply-evidence
          path: .formal-artifacts/raft-reply-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  union-lock:
    name: Quint union-lock model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run independent lease and fencing sentinel
        run: python3 formal/check_lease_fencing_sentinel.py

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Validate the locked repository contract
        run: nix develop -c agent-check preflight

      - name: Install and verify pinned Rust
        run: nix develop -c agent-check rust

      - name: Typecheck model and deterministic traces
        run: nix develop -c agent-check formal-typecheck

      - name: Run deterministic state-machine traces
        run: nix develop -c agent-check formal-test

      - name: Simulate invariants and reach critical states
        run: nix develop -c agent-check formal-simulate

      - name: Generate model-based testing traces
        run: nix develop -c agent-check formal-mbt

      - name: Exhaustively check pull-request bound with Apalache
        run: nix develop -c agent-check formal-verify

      - name: Exhaustively check wider scheduled bound with Apalache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix develop -c agent-check formal-verify-deep

      - name: Run bounded production refinement and ITF replay
        run: nix develop -c agent-check formal-refinement

      - name: Record verification inputs
        if: always()
        run: nix develop -c agent-check formal-provenance

      - name: Upload traces and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fiducia-node-union-lock-formal-artifacts
          path: .formal-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
