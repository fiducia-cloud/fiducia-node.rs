name: Finalize cron webhook clippy fix

on:
  push:
    branches:
      - agent/cron-webhook-hmac-signing
    paths:
      - scripts/apply-cron-webhook-clippy-fix.py
      - .github/workflows/finalize-cron-webhook-clippy-fix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-cron-webhook-clippy-fix.py
      - .github/workflows/finalize-cron-webhook-clippy-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/cron-webhook-hmac-signing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cron-webhook-hmac-signing
          fetch-depth: 0
      - name: Apply the one-line lint fix
        run: python3 scripts/apply-cron-webhook-clippy-fix.py
      - name: Validate the changed Rust source without the sibling workspace
        run: rustfmt --edition 2021 --check src/schedule_runner.rs
      - name: Remove one-shot patch scaffolding
        run: |
          rm scripts/apply-cron-webhook-clippy-fix.py
          rm .github/workflows/finalize-cron-webhook-clippy-fix.yml
      - name: Commit the clean source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: satisfy cron webhook signing clippy gate"
          git push origin HEAD:agent/cron-webhook-hmac-signing
