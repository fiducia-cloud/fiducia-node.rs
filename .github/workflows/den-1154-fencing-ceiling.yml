name: DEN-1154 fencing ceiling hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/den-1154-fencing-ceiling.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Apply DEN-1154 mint, validation, restore, and boundary tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/validate.rs",
              '''/// Sanity ceiling on one request's quota cost (see [`MAX_RATE_LIMIT_LIMIT`]).
pub const MAX_RATE_LIMIT_COST: u32 = 1_000_000;
''',
              '''/// Sanity ceiling on one request's quota cost (see [`MAX_RATE_LIMIT_LIMIT`]).
pub const MAX_RATE_LIMIT_COST: u32 = 1_000_000;
/// Highest fencing token that is exactly representable by JSON/JavaScript.
///
/// New authority is shared with TypeScript/browser callers, so minting past
/// `Number.MAX_SAFE_INTEGER` would make two distinct integer tokens compare as
/// the same rounded number at a consumer boundary. Fail closed before that
/// domain rather than weakening fencing semantics in one runtime.
pub const MAX_FENCING_TOKEN: u64 = 9_007_199_254_740_991;
''')

          replace_once(
              "src/validate.rs",
              '''/// Validate client-supplied fencing authority before proposing a mutation.
pub fn validate_fencing_token(fencing_token: u64) -> Result<(), Rejection> {
    if fencing_token == 0 {
        return Err(Rejection::new(
            "invalid_fencing_token",
            "fencing_token must be greater than zero",
        ));
    }
    Ok(())
}
''',
              '''/// Validate client-supplied fencing authority before proposing a mutation.
pub fn validate_fencing_token(fencing_token: u64) -> Result<(), Rejection> {
    if fencing_token == 0 || fencing_token > MAX_FENCING_TOKEN {
        return Err(Rejection::new(
            "invalid_fencing_token",
            format!(
                "fencing_token must be between 1 and {MAX_FENCING_TOKEN} inclusive"
            ),
        ));
    }
    Ok(())
}
''')

          replace_once(
              "src/validate.rs",
              '''        assert_eq!(
            validate_fencing_token(0).unwrap_err().code,
            "invalid_fencing_token"
        );
''',
              '''        assert_eq!(
            validate_fencing_token(0).unwrap_err().code,
            "invalid_fencing_token"
        );
        assert!(validate_fencing_token(MAX_FENCING_TOKEN - 1).is_ok());
        assert!(validate_fencing_token(MAX_FENCING_TOKEN).is_ok());
        assert_eq!(
            validate_fencing_token(MAX_FENCING_TOKEN + 1)
                .unwrap_err()
                .code,
            "invalid_fencing_token"
        );
''')

          replace_once(
              "src/state.rs",
              '''    /// Mint the next fencing token, or `None` once the counter is exhausted.
    ///
    /// Fail-closed on purpose: a saturating counter would hand every subsequent
    /// caller the *same* `u64::MAX`, and two holders with equal tokens is exactly
    /// the split-brain fencing exists to prevent. Refusing the acquisition keeps
    /// tokens strictly increasing; callers surface it as a failed operation.
    fn next_token(&mut self) -> Option<u64> {
        self.next_fencing_token = self.next_fencing_token.checked_add(1)?;
        Some(self.next_fencing_token)
    }

    /// Mint a fencing token strictly greater than `floor`, advancing this shard's
    /// counter so every later token also exceeds it. Used by handoffs, whose new
    /// owner's token must beat the `from_token` the previous owner presented even
    /// when that token was minted on a different shard's counter. `None` when the
    /// counter is exhausted (see [`Store::next_token`]).
    fn mint_token_above(&mut self, floor: u64) -> Option<u64> {
        self.next_fencing_token = self.next_fencing_token.max(floor).checked_add(1)?;
        Some(self.next_fencing_token)
    }
''',
              '''    /// Mint the next fencing token, or `None` once the exact JSON-safe
    /// authority domain is exhausted.
    ///
    /// Compute before mutating: an exhausted mint must leave the watermark at
    /// the last valid token. Wrapping, saturating, or stepping into the
    /// JSON-inexact integer domain would all permit stale authority to compare
    /// incorrectly in JavaScript/TypeScript consumers.
    fn next_token(&mut self) -> Option<u64> {
        let next = self.next_fencing_token.checked_add(1)?;
        if next > crate::validate::MAX_FENCING_TOKEN {
            return None;
        }
        self.next_fencing_token = next;
        Some(next)
    }

    /// Mint a fencing token strictly greater than `floor`, advancing this shard's
    /// counter so every later token also exceeds it. Used by handoffs, whose new
    /// owner's token must beat the `from_token` the previous owner presented even
    /// when that token was minted on a different shard's counter. A floor at or
    /// above the public ceiling cannot be superseded safely and therefore fails
    /// closed without changing the watermark.
    fn mint_token_above(&mut self, floor: u64) -> Option<u64> {
        if floor >= crate::validate::MAX_FENCING_TOKEN {
            return None;
        }
        let next = self.next_fencing_token.max(floor).checked_add(1)?;
        if next > crate::validate::MAX_FENCING_TOKEN {
            return None;
        }
        self.next_fencing_token = next;
        Some(next)
    }
''')

          replace_once(
              "src/state.rs",
              '''        let floor = self.max_referenced_fencing_token();
        if self.next_fencing_token < floor {
            return Err(format!(
                "next_fencing_token {} is below the highest referenced fencing token {}; \\
                 restoring would re-mint issued tokens",
                self.next_fencing_token, floor
            ));
        }
''',
              '''        let floor = self.max_referenced_fencing_token();
        if floor > crate::validate::MAX_FENCING_TOKEN {
            return Err(format!(
                "highest referenced fencing token {floor} exceeds the supported maximum {}",
                crate::validate::MAX_FENCING_TOKEN
            ));
        }
        if self.next_fencing_token > crate::validate::MAX_FENCING_TOKEN {
            return Err(format!(
                "next_fencing_token {} exceeds the supported maximum {}",
                self.next_fencing_token,
                crate::validate::MAX_FENCING_TOKEN
            ));
        }
        if self.next_fencing_token < floor {
            return Err(format!(
                "next_fencing_token {} is below the highest referenced fencing token {}; \\
                 restoring would re-mint issued tokens",
                self.next_fencing_token, floor
            ));
        }
''')

          needle = '''    #[test]
    fn snapshot_restore_keeps_the_fencing_counter_ahead_of_prior_grants() {
'''
          tests = '''    #[test]
    fn fencing_token_minting_fails_closed_at_the_json_safe_ceiling() {
        let max = crate::validate::MAX_FENCING_TOKEN;
        let mut store = Store {
            next_fencing_token: max - 2,
            ..Store::default()
        };

        assert_eq!(store.next_token(), Some(max - 1));
        assert_eq!(store.next_token(), Some(max));
        assert_eq!(store.next_token(), None);
        assert_eq!(
            store.next_fencing_token, max,
            "an exhausted mint must preserve the last valid watermark"
        );
    }

    #[test]
    fn handoff_mint_above_fails_closed_at_the_json_safe_ceiling() {
        let max = crate::validate::MAX_FENCING_TOKEN;
        let mut store = Store {
            next_fencing_token: max - 2,
            ..Store::default()
        };

        assert_eq!(store.mint_token_above(max - 2), Some(max - 1));
        assert_eq!(store.mint_token_above(max - 1), Some(max));
        assert_eq!(store.mint_token_above(max), None);
        assert_eq!(store.next_fencing_token, max);
    }

    #[test]
    fn restore_rejects_fencing_authority_outside_the_json_safe_domain() {
        let max = crate::validate::MAX_FENCING_TOKEN;

        let too_wide_counter = Store {
            next_fencing_token: max + 1,
            ..Store::default()
        };
        let error = StateMachine::new()
            .restore(&serde_json::to_vec(&too_wide_counter).unwrap())
            .expect_err("an out-of-domain watermark must never become authoritative");
        assert!(error.to_string().contains("supported maximum"));

        let mut too_wide_reference = Store {
            next_fencing_token: max,
            ..Store::default()
        };
        too_wide_reference.tasks.insert(
            "out-of-domain".to_string(),
            TaskRecord {
                task_type: "test".to_string(),
                payload: Value::Null,
                status: TaskStatus::Claimed,
                owner: Some("worker".to_string()),
                fencing_token: max + 1,
                lease_ttl_ms: 1,
                lease_expires_ms: Some(2),
                progress: 0,
                checkpoint: Value::Null,
                result: None,
                deadline_ms: None,
                generation: 1,
            },
        );
        let error = StateMachine::new()
            .restore(&serde_json::to_vec(&too_wide_reference).unwrap())
            .expect_err("referenced authority outside the public domain must fail closed");
        assert!(error.to_string().contains("highest referenced fencing token"));
        assert!(error.to_string().contains("supported maximum"));
    }

'''
          p = Path("src/state.rs")
          text = p.read_text()
          if text.count(needle) != 1:
              raise SystemExit(f"expected one state test insertion point, found {text.count(needle)}")
          p.write_text(text.replace(needle, tests + needle, 1))
          PY
      - name: Format and validate exact boundary hardening
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --lib validate::tests::lock_release_bounds_the_holder
          cargo test --lib state::tests::fencing_token_minting_fails_closed_at_the_json_safe_ceiling
          cargo test --lib state::tests::handoff_mint_above_fails_closed_at_the_json_safe_ceiling
          cargo test --lib state::tests::restore_rejects_fencing_authority_outside_the_json_safe_domain
          cargo test --lib state::tests::snapshot_restore_keeps_the_fencing_counter_ahead_of_prior_grants
          cargo test --lib state::tests::restore_rejects_a_zeroed_or_missing_fencing_counter
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit hardening and remove one-shot workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm .github/workflows/den-1154-fencing-ceiling.yml
          git add src/state.rs src/validate.rs .github/workflows/den-1154-fencing-ceiling.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'DEN-1154 cap Fiducia fencing authority at JSON-safe ceiling'
          git push origin HEAD:main
